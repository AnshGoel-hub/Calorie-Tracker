name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ct, POSTGRES_PASSWORD: ct, POSTGRES_DB: ct}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ct" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Unit and API tests (coverage gate)
        run: pytest --cov=app --cov-fail-under=90
      - name: Migrations apply to Postgres and match the models
        env: {DATABASE_URL: "postgresql://ct:ct@localhost:5432/ct"}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: TDEE backtest (must beat the formula)
        run: python scripts/backtest_tdee.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t calorie-tracker .
