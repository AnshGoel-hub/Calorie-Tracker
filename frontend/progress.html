<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progress · Calorie Tracker</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calories">
<script>try{var t=localStorage.getItem("ct-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f7;--pn:#e9edf0;--card:#fff;--tx:#15181c;--mu:#5d6670;--bd:#d6dbe0;--ac:#f2b705;--on:#1a1400;--bad:#cf3f2b;--k:#d99a00;--p:#3d4fb5;--c:#c98a00;--f:#8e4a9e;--wt:#1f8a70;--wa:#2a8fc7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151a;--pn:#1a1f26;--card:#1f252d;--tx:#e9edf1;--mu:#9aa5b1;--bd:#2b323b;--ac:#f2b705;--bad:#f0705c;--k:#f2b705;--p:#8b99f5;--c:#efb83a;--f:#c58bd6;--wt:#4cc2a1;--wa:#5ab6ea}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151a;--pn:#1a1f26;--card:#1f252d;--tx:#e9edf1;--mu:#9aa5b1;--bd:#2b323b;--ac:#f2b705;--bad:#f0705c;--k:#f2b705;--p:#8b99f5;--c:#efb83a;--f:#c58bd6;--wt:#4cc2a1;--wa:#5ab6ea}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.w{max-width:1120px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}h2{font-size:18px;font-weight:650;margin:0}
a{color:var(--mu)}.sub{color:var(--mu);font-size:13px}
.top{display:flex;flex-wrap:wrap;gap:12px 16px;justify-content:space-between;align-items:center;padding-bottom:16px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.seg2{display:inline-flex;background:var(--pn);border-radius:999px;padding:3px;gap:2px}
.seg2 button{border:0;background:transparent;border-radius:999px;padding:6px 14px;min-height:36px;font-size:13.5px;color:var(--mu);font-weight:600}
.seg2 button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:16px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stats>div{min-width:0}.stats b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}.stats span{display:block;font-size:12.5px;color:var(--mu);margin-top:3px;line-height:1.35}
.up{color:var(--bad);font-weight:600}.dn{color:var(--wt);font-weight:600}
/* last 7 days */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--mu)}
.sc .num{height:14px;font-size:10.5px;line-height:14px;color:var(--mu);white-space:nowrap}
.sc .ba{position:relative;width:100%;height:72px;display:flex;align-items:flex-end}
.sc .ba b{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--ac);min-height:3px}.sc .ba b.o{background:var(--bad)}.sc .ba b.n{background:var(--bd)}
.sc .ba u{position:absolute;left:-3px;right:-3px;bottom:51.4px;border-top:1px dashed color-mix(in srgb,var(--mu) 70%,transparent);pointer-events:none}
.sc.t{color:var(--tx);font-weight:700}
.leg{font-size:12px;color:var(--mu);margin-top:10px}
/* chart card */
.mt{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px 14px;padding:2px 4px}.mt::-webkit-scrollbar{display:none}
.mt button{flex:none;white-space:nowrap;padding:7px 15px;min-height:36px;font-size:13.5px;font-weight:600;background:var(--pn);border:0;color:var(--mu)}
.mt button.on{background:var(--ac);color:var(--on)}
.cw{position:relative;height:clamp(230px,38vw,320px)}
.empty{border:1px dashed var(--bd);border-radius:14px;padding:26px 16px;text-align:center;color:var(--mu);font-size:13.5px}
[hidden]{display:none!important}
/* target record */
.rw{display:grid;grid-template-columns:62px 1fr auto;gap:4px 10px;align-items:center;padding:11px 0;border-top:1px solid var(--bd);cursor:pointer;font-size:14px}
.rw .d{font-weight:600}.rw .k{color:var(--tx)}.rw .st{font-size:12.5px;font-weight:650;white-space:nowrap}.rw .st.ok{color:var(--wt)}.rw .st.bad{color:var(--bad)}
.rw .mc{grid-column:1/-1;display:none;color:var(--mu);font-size:12.5px;padding-left:72px}.rw.open .mc{display:block}
.more{width:100%;margin-top:8px}
/* achievements link */
.aw{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--tx)}
.aw div{flex:1}.aw b{display:block;font-size:15px}.aw span{font-size:12.5px;color:var(--mu)}.aw i{font-style:normal;font-size:22px;color:var(--mu)}
@media(max-width:780px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:16px}button{min-height:40px}}
@media(max-width:380px){.sc .num{font-size:9.5px}}
</style><link rel="stylesheet" href="/ui.css"><script src="/nav.js" defer></script></head>
<body><div class="w">
<header class="top">
 <div><h1>Progress</h1><div class="sub" id="rsub"></div></div>
 <div class="seg2" id="rg" role="group" aria-label="Time range"><button type="button" data-r="7" class="on">7D</button><button type="button" data-r="30">30D</button><button type="button" data-r="90">90D</button><button type="button" data-r="0">All</button></div>
</header>
<div id="err" class="sub" role="alert"></div>

<div class="stats" id="tiles"></div>

<section class="card">
 <div class="ch"><h2>Last 7 days</h2><span class="sub">Calories per day</span></div>
 <div class="strip" id="strip"></div>
 <div class="leg">Dashed line = your target. Red bars are over target + 5%.</div>
</section>

<section class="card">
 <div class="ch"><h2 id="ctitle">Calories</h2><span class="sub" id="ccap"></span></div>
 <div class="mt" id="mt" role="tablist" aria-label="Chart"><button type="button" data-m="cal" class="on">Calories</button><button type="button" data-m="pro">Protein</button><button type="button" data-m="car">Carbs</button><button type="button" data-m="fat">Fats</button><button type="button" data-m="wt">Weight</button><button type="button" data-m="wat">Water</button></div>
 <div class="cw" id="cwrap"><canvas id="cv"></canvas></div>
 <div class="empty" id="empty" hidden></div>
</section>

<section class="card">
 <div class="ch"><h2>Target record</h2><span class="sub" id="rcount"></span></div>
 <div id="hist"></div>
 <button class="more" id="more" type="button" hidden>Show all</button>
</section>

<a class="card aw" href="/achievements"><div><b>Achievements</b><span>Streaks, badges and monthly challenges</span></div><i>›</i></a>
</div>

<script>
const $=id=>document.getElementById(id);
const iso=d=>d.toLocaleDateString("en-CA");
const R=n=>Math.round(n).toLocaleString("en-IN");
const toLogin=()=>{location.href="/login"};
let S={log:{},custom:[],target:2000},range=7,metric="cal",showAll=false,chart=null;
const MARGIN=1.05,isOver=(k,t)=>k>t*MARGIN;
const isRec=d=>!!d&&((d.e&&d.e.length>0)||d.w>0||d.wt!=null);
const tot=e=>e.reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{k:0,p:0,c:0,f:0});
const avgOf=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const METRICS={
 cal:{l:"Calories",u:"kcal",c:"--k",get:s=>s.dd?tot(s.dd.e).k:null},
 pro:{l:"Protein",u:"g",c:"--p",get:s=>s.dd?tot(s.dd.e).p:null},
 car:{l:"Carbs",u:"g",c:"--c",get:s=>s.dd?tot(s.dd.e).c:null},
 fat:{l:"Fats",u:"g",c:"--f",get:s=>s.dd?tot(s.dd.e).f:null},
 wt:{l:"Weight",u:"kg",c:"--wt",get:s=>s.lg&&s.lg.wt!=null?s.lg.wt:null},
 wat:{l:"Water",u:"glasses",c:"--wa",get:s=>s.lg&&s.lg.w>0?s.lg.w:null}};

function nDays(){
 if(range)return range;
 const ks=Object.keys(S.log).sort();
 return ks.length?Math.max(7,Math.round((new Date(iso(new Date()))-new Date(ks[0]))/864e5)+1):7}
// n days ending `off` days before today, oldest first
function ser(n,off){const out=[],end=new Date();
 for(let i=n-1+off;i>=off;i--){const d=new Date(end);d.setDate(end.getDate()-i);const k=iso(d),g=S.log[k]||null;
  out.push({k,l:d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}),dd:g&&g.e&&g.e.length?g:null,lg:g})}
 return out}

function tiles(cur,prev,n){
 const lg=cur.filter(s=>s.dd),a1=avgOf(lg.map(s=>tot(s.dd.e).k)),a0=prev?avgOf(prev.filter(s=>s.dd).map(s=>tot(s.dd.e).k)):null;
 const inT=lg.filter(s=>!isOver(tot(s.dd.e).k,s.dd.t)).length;
 const rec=k=>isRec(S.log[k]);
 let st=0,d=new Date();if(!rec(iso(d)))d.setDate(d.getDate()-1);
 while(rec(iso(d))){st++;d.setDate(d.getDate()-1)}
 let best=0,run=0,pv=null;
 Object.keys(S.log).filter(rec).sort().forEach(k=>{run=pv&&(new Date(k)-new Date(pv))/864e5===1?run+1:1;best=Math.max(best,run);pv=k});
 const w=cur.map(s=>s.lg&&s.lg.wt!=null?s.lg.wt:null).filter(x=>x!=null);
 const t=(b,s)=>'<div><b>'+b+'</b><span>'+s+'</span></div>';
 const dl=a1!=null&&a0!=null?'<br><span class="'+(a1>a0?"up":"dn")+'">'+(a1>a0?"+":"−")+R(Math.abs(a1-a0))+" kcal</span> vs previous "+n+" days":"";
 let wv,ws;
 if(w.length>=2){const ch=w[w.length-1]-w[0];wv=(ch>=0?"+":"−")+Math.abs(ch).toFixed(1)+" kg";ws="Weight change · now "+w[w.length-1].toFixed(1)+" kg"}
 else if(w.length===1){wv=w[0].toFixed(1)+" kg";ws="Latest weight"}
 else{wv="–";ws="No weight logged"}
 $("tiles").innerHTML=
  t(a1==null?"–":R(a1)+" kcal","Average per logged day"+dl)+
  t(lg.length?inT+" of "+lg.length:"–","Logged days within target")+
  t(st+(st===1?" day":" days"),"Record streak · best "+best)+
  t(wv,ws)}

function strip(){
 const s7=ser(7,0),td=iso(new Date());
 $("strip").innerHTML=s7.map(s=>{const q=s.dd,k=q?tot(q.e).k:0,r=q?k/q.t:0,h=q?Math.round(Math.min(1.4,r)/1.4*72):3;
  return '<div class="sc'+(s.k===td?" t":"")+'"><span class="num">'+(q?R(k):"")+'</span><div class="ba"><u></u><b class="'+(!q?"n":isOver(k,q.t)?"o":"")+'" style="height:'+h+'px" title="'+(q?R(k)+" kcal":isRec(s.lg)?"No food logged":"Nothing recorded")+'"></b></div>'+new Date(s.k+"T00:00").toLocaleDateString("en-GB",{weekday:"short"}).slice(0,2)+'</div>'}).join("")}

function drawChart(sr){
 const m=METRICS[metric],vals=sr.map(m.get),nn=vals.filter(x=>x!=null);
 chart&&chart.destroy();chart=null;
 $("ctitle").textContent=m.l;
 $("cwrap").hidden=!nn.length;$("empty").hidden=!!nn.length;
 if(!nn.length){$("ccap").textContent="";$("empty").textContent="No "+m.l.toLowerCase()+" data in this range yet.";return}
 const avg=avgOf(nn);
 $("ccap").textContent=metric==="wt"?"Latest "+nn[nn.length-1].toFixed(1)+" kg · "+nn.length+(nn.length===1?" weigh-in":" weigh-ins")
  :"Average "+(metric==="cal"?R(avg):avg.toFixed(metric==="wat"?1:0))+" "+m.u+" per "+(metric==="wat"?"recorded":"logged")+" day · "+nn.length+(nn.length===1?" day":" days");
 if(!window.Chart)return;
 const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim(),mu=v("--mu"),bd=v("--bd"),bad=v("--bad"),col=v(m.c),small=sr.length>31;
 const opt={responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},plugins:{legend:{display:false}},
  scales:{x:{ticks:{color:mu,maxTicksLimit:7},grid:{display:false}},y:{beginAtZero:true,ticks:{color:mu},grid:{color:bd}}}};
 const lab=sr.map(s=>s.l);let cfg;
 if(metric==="wat"){opt.scales.y.ticks.precision=0;
  cfg={type:"bar",data:{labels:lab,datasets:[{data:vals,backgroundColor:col,borderRadius:3}]},options:opt}}
 else if(metric==="wt"){opt.scales.y.beginAtZero=false;
  const ma=vals.map((_,i)=>{const w=vals.slice(Math.max(0,i-6),i+1).filter(x=>x!=null);return w.length?+avgOf(w).toFixed(2):null});
  cfg={type:"line",data:{labels:lab,datasets:[
   {data:vals,showLine:false,pointRadius:small?2:4,pointBackgroundColor:col+"88",pointBorderColor:col+"88"},
   {data:ma,borderColor:col,borderWidth:2,pointRadius:0,tension:.3,spanGaps:true}]},options:opt}}
 else{
  const over=metric==="cal"?sr.map((s,i)=>s.dd&&isOver(vals[i],s.dd.t)):[],pc=metric==="cal"?sr.map((s,i)=>over[i]?bad:col):col;
  const ds=[{data:vals.map(x=>x==null?null:+x.toFixed(1)),borderColor:col,backgroundColor:col+"22",fill:true,tension:.3,spanGaps:true,borderWidth:2,pointRadius:small?2:4,pointBackgroundColor:pc,pointBorderColor:pc}];
  if(metric==="cal")ds.push({data:sr.map(s=>s.dd?s.dd.t:S.target),borderColor:mu,borderDash:[6,4],borderWidth:1.5,pointRadius:0,fill:false});
  cfg={type:"line",data:{labels:lab,datasets:ds},options:opt}}
 chart=new Chart($("cv"),cfg)}

function history(sr){
 const days=sr.filter(s=>s.dd).slice().reverse(),shown=showAll?days:days.slice(0,10);
 $("rcount").textContent=days.length?days.length+(days.length===1?" day":" days"):"";
 $("hist").innerHTML=days.length?shown.map(s=>{const q=tot(s.dd.e),o=isOver(q.k,s.dd.t);
  return '<div class="rw"><span class="d">'+s.l+'</span><span class="k">'+R(q.k)+" / "+R(s.dd.t)+' kcal</span><span class="st '+(o?"bad":"ok")+'">'+(o?"+"+R(q.k-s.dd.t):"On target")+'</span><div class="mc">P '+q.p.toFixed(0)+" g · C "+q.c.toFixed(0)+" g · F "+q.f.toFixed(0)+" g</div></div>"}).join(""):'<div class="empty">No days logged in this range yet.</div>';
 $("more").hidden=days.length<=10;$("more").textContent=showAll?"Show fewer":"Show all "+days.length+" days"}

function render(){
 const n=nDays(),cur=ser(n,0),prev=range?ser(n,n):null;
 $("rsub").textContent=range?"Last "+n+" days":"All time · "+n+" days";
 tiles(cur,prev,n);strip();drawChart(cur);history(cur)}

$("rg").onclick=e=>{const b=e.target.closest("button");if(!b)return;range=+b.dataset.r;showAll=false;document.querySelectorAll("#rg button").forEach(x=>x.classList.toggle("on",x===b));render()};
$("mt").onclick=e=>{const b=e.target.closest("button");if(!b)return;metric=b.dataset.m;document.querySelectorAll("#mt button").forEach(x=>x.classList.toggle("on",x===b));drawChart(ser(nDays(),0))};
$("hist").onclick=e=>{const r=e.target.closest(".rw");if(r)r.classList.toggle("open")};
$("more").onclick=()=>{showAll=!showAll;history(ser(nDays(),0))};
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);

(async()=>{
 try{const r=await fetch("/api/data");if(r.status===401)return toLogin();if(!r.ok)throw 0;
  S=Object.assign({log:{},custom:[],target:2000},await r.json())}
 catch(e){$("err").textContent="Couldn’t load your data. Try again in a moment.";return}
 render();
})();
</script></body></html>
