services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: ct, POSTGRES_PASSWORD: ct, POSTGRES_DB: ct}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ct"], interval: 5s, retries: 10}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
  web:
    build: .
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    environment:
      DATABASE_URL: postgresql://ct:ct@db:5432/ct
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-change-me
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      INVITE_CODE: ${INVITE_CODE:-}
volumes:
  pgdata:
